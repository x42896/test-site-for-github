<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
        }

        form {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
            max-width: 400px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        p {
            text-align: center;
            margin-bottom: 40px;
            color: #555;
            max-width: 800px;
            padding: 0 40px;
        }
    </style>
</head>
<body>
    <h2>Оставьте заявку</h2>
    <p>На этой странице можно ввести днные в поля для ввода и они отправятся в базу данных. Подключение и отправка данных находится в файле submit.php там логин и пароль но они "root", потому что подключение происходит через MAMP (так что ничего не скрываю)</p>
    <form action="/php/submit.php" method="post">
        <label>Ваше имя: <input type="text" name="name" required></label><br><br>
        <label>Возраст: <input type="number" name="age" required></label><br><br>
        <label>Курс:
            <select name="course">
                <option>Roblox</option>
                <option>Веб-разработка</option>
                <option>Python</option>
            </select>
        </label><br><br>
        <button type="submit">Отправить заявку</button>
    </form>
</body>
</html>
